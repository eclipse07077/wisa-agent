[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wisa-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]
tc = [
  "fastavro>=1.9,<2",
  "scikit-learn>=1.4,<2",
  "scipy>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "experiments"]
testpaths = ["tests"]
